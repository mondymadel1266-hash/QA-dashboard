<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Team Leader Performance Dashboard</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; }
        .login-box h3 { margin-bottom: 20px; color: #38bdf8; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; outline: none; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .login-box button:hover { background: #2563eb; }
        #error-msg { color: #ef4444; margin-top: 10px; font-size: 14px; display: none; }
        #app-content { display: none; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="login-overlay">
        <div class="login-box">
            <h3>تسجيل الدخول للداشبورد</h3>
            <input type="text" id="login-user" placeholder="اسم المستخدم (User)">
            <input type="password" id="login-pass" placeholder="كلمة المرور (Password)">
            <button onclick="handleLogin()">دخول</button>
            <p id="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- محتوى الموقع الأساسي -->
    <div id="app-content">
        <div class="header-bar">
            <h2>Team Leader Performance Dashboard</h2>
            <div>
                <span id="user-role-badge" style="background: #334155; padding: 5px 12px; border-radius: 20px; font-size: 14px; margin-left: 10px;"></span>
                <button onclick="logout()" style="background: #ef4444; border: none; padding: 6px 12px; color: #fff; border-radius: 4px; cursor: pointer;">خروج</button>
            </div>
        </div>

        <div id="dashboard-body">
            <!-- هنا يتم عرض محتوى الداشبورد الخاص بك -->
            <div style="background: #1e293b; padding: 25px; border-radius: 8px; text-align: center;">
                <h1 id="welcome-title" style="color: #38bdf8;">أهلاً بك</h1>
                <p id="role-desc">جاري تحميل بيانات الفريق...</p>
            </div>
        </div>
    </div>

    <script>
        // تعريف المستخدمين والصلاحيات
        const users = {
            "admin": { pass: "admin123", role: "Admin", leader: "All" },
            "ahmed": { pass: "ahmed123", role: "Team Leader", leader: "Ahmed Magdy" },
            "diaa": { pass: "diaa123", role: "Team Leader", leader: "Diaa El-Sayed" },
            "yasmine": { pass: "yasmine123", role: "Team Leader", leader: "Yasmine Maher" }
        };

        function handleLogin() {
            const u = document.getElementById("login-user").value.trim().toLowerCase();
            const p = document.getElementById("login-pass").value.trim();

            if (users[u] && users[u].pass === p) {
                // حفظ الجلسة الحالية
                sessionStorage.setItem("currentUser", u);
                initDashboard(u);
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function initDashboard(username) {
            const userData = users[username];
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("app-content").style.display = "block";
            
            document.getElementById("user-role-badge").innerText = `${userData.role}: ${username}`;
            
            if (userData.role === "Admin") {
                document.getElementById("welcome-title").innerText = "لوحة تحكم المدير (Admin Dashboard)";
                document.getElementById("role-desc").innerText = "لديك الصلاحية الكاملة للاطلاع على كل الفرق، التعديل، ورفع البيانات.";
                // هنا يمكنك إظهار زر Upload Data المعتاد للأدمن فقط
            } else {
                document.getElementById("welcome-title").innerText = `لوحة أداء فريق: ${userData.leader}`;
                document.getElementById("role-desc").innerText = "تعرض هذه الصفحة إحصائيات وأداء أعضاء فريقك فقط.";
                // هنا يمكنك برمجة الكود بحيث يقوم بفلترة الجدول تلقائياً ليظهر فقط أعضاء هذا التيم ليدر
            }
        }

        function logout() {
            sessionStorage.removeItem("currentUser");
            location.reload();
        }

        // التحقق إذا كان المستخدم مسجل دخول بالفعل أثناء حدوث Refresh
        window.onload = function() {
            const savedUser = sessionStorage.getItem("currentUser");
            if (savedUser && users[savedUser]) {
                initDashboard(savedUser);
            }
        }

        // دعم الضغط على Enter
        document.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleLogin();
            }
        });
    </script>
</body>
</html>
