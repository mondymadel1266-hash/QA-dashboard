<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team Leader Performance Dashboard · 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#0d1016;--white:#12151c;--panel2:#171b24;--border:#20242f;--border2:#2a3040;
  --text:#e8eaef;--text2:#9aa1af;--text3:#6b7280;
  --accent:#5c7cfa;--accent-l:rgba(92,124,250,.12);
  --purple:#a78bfa;--purple-l:rgba(167,139,250,.12);
  --green:#34d399;--green-l:rgba(52,211,153,.12);
  --red:#f87171;--red-l:rgba(248,113,113,.12);
  --r:10px;--r-lg:14px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
.shell{display:flex;min-height:100vh}
.main{padding:22px 28px 40px;max-width:1480px;margin:0 auto;width:100%}
body.auth-locked{overflow:hidden}
body.auth-locked .shell{display:none}
.auth{position:fixed;inset:0;z-index:9999;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);color:var(--text);font-family:'Cairo','Inter',sans-serif}
.auth[hidden]{display:none}
.auth-brand{padding:44px 48px;color:#fff;background:linear-gradient(160deg,#1f2a5a,#14183a);display:flex;flex-direction:column;justify-content:space-between}
.auth-main{display:flex;flex-direction:column;justify-content:center;padding:22px 28px}
.auth-card{width:100%;max-width:480px;margin:auto}
.auth-btn{width:100%;height:48px;border:0;border-radius:12px;cursor:pointer;color:#fff;background:var(--accent);font-weight:700;margin-top:16px}
</style>
</head>
<body class="auth-locked">

<div class="auth" id="authRoot" role="dialog" lang="ar" dir="rtl">
  <aside class="auth-brand">
    <h1>لوحة أداء الجودة</h1>
    <p>متابعة أداء الوكلاء وتحليل جودة المكالمات.</p>
  </aside>
  <main class="auth-main">
    <form class="auth-card" id="authForm">
      <h2>تسجيل الدخول</h2>
      <div style="margin-top:15px">
        <label>الحساب</label>
        <select id="authAcct" style="width:100%;height:40px;padding:5px;margin-top:5px;border-radius:8px;border:1px solid #ccc;background:var(--white);color:var(--text)">
          <option value="admin">مدير النظام (Admin)</option>
        </select>
      </div>
      <div style="margin-top:15px">
        <label>كلمة المرور</label>
        <input id="authPw" type="password" style="width:100%;height:40px;padding:5px;margin-top:5px;border-radius:8px;border:1px solid #ccc;background:var(--white);color:var(--text)">
      </div>
      <button type="submit" class="auth-btn">دخول</button>
    </form>
  </main>
</div>

<div class="shell" id="shell">
  <main class="main">
    <h1>لوحة التحكم الرئيسية</h1>
    <p>أهلاً بك في النظام، تعمل اللوحة الآن بدون أي خدمات خارجية.</p>
  </main>
</div>

<script>
document.getElementById('authForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  document.body.classList.remove('auth-locked');
  document.getElementById('authRoot').hidden = true;
  document.getElementById('shell').style.display = 'flex';
});
</script>
</body>
</html>
